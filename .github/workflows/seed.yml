name: Cloudflare flight task seeding (bounded)
# Monthly top-up: tasks self-reschedule every 24h until their depart_date passes,
# so one seed keeps its routes covered for the life of the date window.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Submit the generated task plan now (requires admin key)'
        type: boolean
        default: false
  schedule:
    - cron: '23 1 1 * *'   # 1st of month 01:23 UTC = 09:23 Asia/Taipei
permissions:
  contents: read
concurrency:
  group: ai-flight-radar-cloudflare-seed
  cancel-in-progress: false
jobs:
  seed:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.CF_RADAR_SEED_ENABLED == 'true' &&
      vars.CF_RADAR_COLLECTOR_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.execute == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require a current BUILD or NARROW calibration receipt before seeding
        run: node cloudflare/scripts/calibration-gate.mjs --require-admitted
      - name: Install task tooling from the committed lock
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Write the reviewable task plan
        run: python cloudflare/scripts/tasks.py --output "$RUNNER_TEMP/plan.json"
      - name: Submit the reviewed plan to the admin API
        env:
          RADAR_URL: ${{ vars.CF_RADAR_URL }}
          RADAR_ADMIN_KEY: ${{ secrets.CF_RADAR_ADMIN_KEY }}
        run: python cloudflare/scripts/tasks.py --file "$RUNNER_TEMP/plan.json" --execute
