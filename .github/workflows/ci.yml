name: Quality checks
on:
  push:
    branches: [main, 'fix/price-integrity-*', 'feat/figma-ui-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_ENABLED: 'false'
      TELEGRAM_ENABLED: 'false'
      API_HOST: '127.0.0.1'
      DEPLOYMENT_MODE: local
      UI_SCREENSHOTS_DIR: ui-test-artifacts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m compileall -q ai api config core engine notifier providers deploy main.py
      - run: python -m pytest -q
      - run: node --test tests/test_ui_logic.mjs
      - run: python main.py --help
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-browser-checks
          path: ui-test-artifacts/*.png
          retention-days: 7
          if-no-files-found: warn
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build deployable image
        run: docker build -t radar:test .
      - name: Public-mode startup, assets, auth and non-root smoke test
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          docker volume create radar-test-data
          docker run -d --name radar-smoke -p 127.0.0.1:8787:8787 \
            -e API_KEY="$KEY" -e AUTOSCAN_ENABLED=false \
            -v radar-test-data:/app/data radar:test
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/radar-health.json; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/ui/config
          curl -fsS http://127.0.0.1:8787/assets/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8787/api/scan/trigger)" = 401
          test "$(docker exec radar-smoke id -u)" = 10001
          docker restart radar-smoke
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/ui/quotes
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs radar-smoke || true
          docker rm -f radar-smoke || true
          docker volume rm radar-test-data || true
  dependency-locks:
    # Clean-checkout gate: install from the committed resolution artifacts,
    # then regenerate them and fail if any tracked file changes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Install exactly the committed Python graph
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install exactly the committed Node graph
        working-directory: cloudflare
        run: npm ci
      - name: Regenerate the Node lockfile with the documented npm
        working-directory: cloudflare
        run: npx --yes npm@10.9.4 install --package-lock-only
      - name: Regenerate the Python locks with the documented uv
        run: |
          python -m pip install uv==0.12.15
          uv pip compile requirements.txt -o requirements.lock --generate-hashes --universal --python-version 3.12
          uv pip compile requirements-dev.txt -o requirements-dev.lock --generate-hashes --universal --python-version 3.12
      - name: Fail if regeneration changed any tracked file
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
