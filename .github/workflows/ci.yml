name: Quality checks
on:
  push:
    branches: [main, 'fix/price-integrity-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_ENABLED: 'false'
      TELEGRAM_ENABLED: 'false'
      API_HOST: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q ai api config core engine notifier providers main.py
      - run: python -m pytest -q
      - run: python main.py --help
